name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  http-tests:
    name: HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Start Postgres and Garage
        run: scripts/dev-up.sh
        env:
          CONTAINER_ENGINE: docker

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --features server --all-targets -- -D warnings

      - name: Run the HTTP test suite
        run: scripts/test.sh

  pdf-conversion:
    name: PDF conversion (slow, real LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The packages the app image (Containerfile) has.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-impress-nogui \
            fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core
          soffice --version

      - name: Start Postgres and Garage
        run: scripts/dev-up.sh
        env:
          CONTAINER_ENGINE: docker

      - name: Run the slow PDF conversion tests
        run: scripts/test.sh pdf_conversion -- --ignored

  # The server's files (deploy/): the scripts pass shellcheck, and Compose
  # accepts the compose file, with stand-in secrets.
  deploy-files:
    name: Deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/bin/* deploy/backup/famat-backup deploy/garage/bootstrap.sh
      - name: docker compose config
        run: |
          dir="$(mktemp -d)"
          cp deploy/compose.yaml deploy/garage/garage.toml "$dir"/
          mkdir "$dir/secrets"
          for f in db s3 garage tunnel; do echo "STAND_IN=1" > "$dir/secrets/$f.env"; done
          docker compose --project-directory "$dir" config --quiet
          docker compose --project-directory "$dir" config --services
          # Nothing may be published on the host (the app trusts CF-Connecting-IP).
          if docker compose --project-directory "$dir" config --no-env-resolution | grep -E '^\s+ports:'; then
            echo "deploy/compose.yaml publishes a port" >&2
            exit 1
          fi

  wasm-client:
    name: WASM client builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown --features web
