name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  http-tests:
    name: HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Start Postgres and Garage
        run: scripts/dev-up.sh
        env:
          CONTAINER_ENGINE: docker

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --features server --all-targets -- -D warnings

      - name: Run the HTTP test suite
        run: scripts/test.sh

  pdf-conversion:
    name: PDF conversion (slow, real LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The packages the app image (Containerfile) has.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-impress-nogui \
            fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core
          soffice --version

      - name: Start Postgres and Garage
        run: scripts/dev-up.sh
        env:
          CONTAINER_ENGINE: docker

      - name: Run the slow PDF conversion tests
        run: scripts/test.sh pdf_conversion -- --ignored

  wasm-client:
    name: WASM client builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown --features web
