name: Image

# Builds the release bundle, runs the HTTP suite against it, puts that same
# bundle in the app image, checks the image starts and answers /healthz, and
# (on main only) pushes it to ghcr.io/robertconde/famat-tests, where the
# server's famat-update.timer picks up :latest (deploy/bin/famat-update).
#
# amd64 only: the server is amd64, and building the WASM client and server
# under QEMU for arm64 would take far longer than the rest of CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/robertconde/famat-tests

jobs:
  image:
    name: Release bundle, HTTP suite, app image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-bundle

      - name: Install dioxus-cli 0.7.10
        run: |
          if [ "$(dx --version 2>/dev/null | awk '{print $2}')" != "0.7.10" ]; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi
          dx --version

      # A clean dist/ every time (ADR 0001).
      - name: Build the release bundle
        run: scripts/bundle.sh

      - name: Start Postgres and Garage
        run: scripts/dev-up.sh
        env:
          CONTAINER_ENGINE: docker

      - name: Run the HTTP suite against the release bundle
        run: FAMAT_TEST_SERVER="$PWD/dist/server" scripts/test.sh

      - uses: docker/setup-buildx-action@v3

      # The tested dist/ replaces the Containerfile's own build stage.
      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          build-contexts: bundle=dist
          platforms: linux/amd64
          load: true
          tags: famat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image against the same Postgres and Garage: it must migrate,
      # serve, and pass the health check deploy/compose.yaml runs.
      - name: Smoke-test the image
        run: |
          set -a; . ~/.cache/famat-dev/dev.env; set +a
          docker run -d --name famat-smoke --network host \
            -e IP=127.0.0.1 -e PORT=18080 \
            -e DATABASE_URL -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET \
            -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e PDF_WORKERS=0 \
            famat:ci
          for _ in $(seq 1 60); do
            docker exec famat-smoke curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          docker exec famat-smoke curl -fsS --max-time 5 http://127.0.0.1:18080/healthz
          curl -fsS -o /dev/null -w 'GET / → %{http_code}\n' http://127.0.0.1:18080/
          docker exec famat-smoke soffice --version
      - name: Smoke-test log
        if: always()
        run: docker logs famat-smoke 2>&1 | tail -50 || true

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="sha-${GITHUB_SHA::12}"
          for tag in latest "$sha"; do
            docker tag famat:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
