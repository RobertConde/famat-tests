[package]
name = "famat"
version = "0.1.0"
edition = "2024"
publish = false
description = "The FAMAT Test Bank: a searchable archive of past FAMAT and Mu Alpha Theta tests"

[dependencies]
# Pinned exactly: Dioxus breaks its API between minors (ADR 0001).
dioxus = { version = "=0.7.10", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }

# Server-only dependencies stay out of the WASM bundle.
tokio = { version = "1.48", features = ["full"], optional = true }
axum = { version = "0.8.4", optional = true }
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "derive",
    "macros",
    "migrate",
    "json",
], optional = true }
aws-sdk-s3 = { version = "1", optional = true, features = ["behavior-version-latest"] }
tokio-util = { version = "0.7", features = ["io", "compat"], optional = true }
async_zip = { version = "0.0.17", features = ["tokio"], optional = true }
futures = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
log = { version = "0.4", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
argon2 = { version = "0.5", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
getrandom = { version = "0.3", optional = true }
rpassword = { version = "7", optional = true }
serde_json = { version = "1", optional = true }
# PDF conversion (server::pdf): checking that a PDF parses, writing PDFs of
# images, telling file types apart, and the per-job LibreOffice profiles.
lopdf = { version = "0.47", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "gif", "tiff", "bmp", "webp"], optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2.4", default-features = false, optional = true }
cfb = { version = "0.16", optional = true }
tempfile = { version = "3", optional = true }
libc = { version = "0.2", optional = true }
# The upload body layer (server::upload).
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }

[features]
default = []
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:axum",
    "dep:sqlx",
    "dep:aws-sdk-s3",
    "dep:tokio-util",
    "dep:async_zip",
    "dep:futures",
    "dep:anyhow",
    "dep:log",
    "dep:serde_urlencoded",
    "dep:argon2",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:getrandom",
    "dep:rpassword",
    "dep:serde_json",
    "dep:lopdf",
    "dep:image",
    "dep:flate2",
    "dep:zip",
    "dep:cfb",
    "dep:tempfile",
    "dep:libc",
    "dep:tower-layer",
    "dep:tower-service",
]

[dev-dependencies]
# The HTTP test harness (tests/): it starts the real binary and talks to it,
# Postgres and Garage from the outside.
tokio = { version = "1.48", features = ["full"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-none", "postgres"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "stream"] }
futures-util = { version = "0.3", default-features = false }
scraper = "0.29"
# Reads server functions' JSON, e.g. what Add test's kind dropdowns list.
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Reads the zips the server streams, independently of async_zip. Stored only.
zip = { version = "2.4", default-features = false }
# Reads the PDFs real conversions make (the slow tests).
lopdf = { version = "0.47", default-features = false }

[[test]]
name = "http"
path = "tests/http/main.rs"
required-features = ["server"]

# argon2 is deliberately slow; unoptimised it takes seconds per login in
# debug builds and the HTTP tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# dx client release profile. Defining it replaces the ad-hoc one dx makes
# (opt-level "s"), so it must inherit from release itself.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
